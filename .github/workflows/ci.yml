name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test

    services:
      db:
        image: postgres:18
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launch_cart_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Set up Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Cache Mix Dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Install and Build JavaScript
        run: npm ci
        working-directory: assets

      - name: Build Custom Element Manifest
        run: npm run analyze
        working-directory: assets

      - name: Run JavaScript Tests
        run: npm test
        working-directory: assets
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Run Elixir Tests
        run: mix test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy to Fly.IO
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
      - run: flyctl deploy -c launch-cart-dev.toml --remote-only
